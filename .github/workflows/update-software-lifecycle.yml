name: Update Software Lifecycle Data

on:
  schedule:
    - cron: "0 6 * * *" # daily at 06:00 UTC
  push:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fortinet-lifecycle-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Pull latest changes
        run: git pull

      - name: Run fetch script
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL_SOFTWARE }}
        run: python fetch_software_lifecycle.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add categories_software/ state_software/
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: update software lifecycle data [skip ci]"
            git push
          fi
